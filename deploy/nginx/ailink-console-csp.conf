# Preserve the upstream policy and its per-response script nonce. If the
# upstream stops sending frame-src, pass its policy through unchanged.
map $upstream_http_content_security_policy $ailink_console_csp {
    default $upstream_http_content_security_policy;
    "~*^(?<ailink_csp_start>(?:[^;]*;)*[[:space:]]*frame-src)[[:space:]]+(?<ailink_csp_rest>.+)$" "$ailink_csp_start https://docs.ailink1.com $ailink_csp_rest";
}
