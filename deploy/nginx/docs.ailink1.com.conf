server {
    listen 80;
    listen [::]:80;
    server_name docs.ailink1.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare may use HTTP to the origin in Flexible mode. The public
        # URL remains HTTPS, so keep the application URL and cookies secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.ailink1.com;
    ssl_certificate /etc/nginx/certs/docs.ailink1.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/docs.ailink1.com/privkey.pem;
    include /etc/nginx/conf.d/snippets/blocked-clients.inc;
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
